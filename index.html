<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="theme-color" content="#111827"/>
  <title>Operación A2</title>
  <link rel="manifest" href="manifest.webmanifest"/>
  <style>
    :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#111827;background:#f3f4f6}
    *{box-sizing:border-box} body{margin:0}.wrap{max-width:760px;margin:auto;padding:16px 16px 90px}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
    h1{font-size:1.45rem;margin:0}.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 18px #0001}
    button,.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;font-size:1rem;cursor:pointer}
    .primary{background:#111827;color:white}.secondary{background:#e5e7eb;color:#111827}.danger{background:#fee2e2;color:#991b1b}
    input[type=file]{width:100%;padding:14px;background:#f9fafb;border:1px dashed #9ca3af;border-radius:12px}
    .muted{color:#6b7280}.hidden{display:none!important}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}
    .option{display:block;width:100%;text-align:left;margin:9px 0;background:#f3f4f6;border:2px solid transparent}
    .option.selected{border-color:#111827;background:#e5e7eb}.progress{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden}
    .progress>div{height:100%;background:#111827}.topline{display:flex;justify-content:space-between;gap:8px;align-items:center}
    .pill{background:#eef2ff;border-radius:999px;padding:6px 10px;font-size:.85rem}
    .score{font-size:3rem;font-weight:800}.wrong{border-left:5px solid #b91c1c}.correct{border-left:5px solid #15803d}
    table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}
    nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:center;z-index:5}
    nav div{max-width:760px;width:100%;display:flex}nav button{flex:1;background:white;border-radius:0;font-size:.85rem}
    textarea{width:100%;min-height:180px;border:1px solid #d1d5db;border-radius:12px;padding:12px}
    .notice{background:#fffbeb;border:1px solid #fde68a;padding:12px;border-radius:12px}
  </style>
</head>
<body>
<div class="wrap">
<header><h1>OPERACIÓN A2</h1><span class="pill">Simulacros</span></header>

<section id="home">
  <div class="card">
    <h2>Subir simulacro</h2>
    <p class="muted">PDF con 90 preguntas A/B/C/D y plantilla de respuestas al final.</p>
    <input id="pdfFile" type="file" accept="application/pdf"/>
    <div style="height:10px"></div>
    <button class="primary" onclick="importPDF()">Importar PDF</button>
    <p id="importMsg" class="muted"></p>
  </div>
  <div class="card">
    <h2>También puedes pegar el texto</h2>
    <p class="muted">Sirve como alternativa si el navegador no puede leer el PDF directamente.</p>
    <textarea id="rawText" placeholder="Pega aquí el texto extraído del simulacro..."></textarea>
    <button class="secondary" onclick="importText()">Importar texto</button>
  </div>
  <div class="card">
    <h2>Simulacros guardados</h2>
    <div id="tests"></div>
  </div>
</section>

<section id="exam" class="hidden">
  <div class="topline"><button class="secondary" onclick="goHome()">Salir</button><span id="counter" class="pill"></span></div>
  <div class="progress"><div id="bar"></div></div>
  <div class="card">
    <h2 id="qtext"></h2>
    <div id="opts"></div>
  </div>
  <div class="row">
    <button class="secondary" onclick="prevQ()">Anterior</button>
    <button class="secondary" onclick="clearAnswer()">En blanco</button>
    <button class="primary" onclick="nextQ()">Siguiente</button>
  </div>
  <div style="height:10px"></div>
  <button class="danger" style="width:100%" onclick="finishExam()">Finalizar y corregir</button>
</section>

<section id="result" class="hidden">
  <button class="secondary" onclick="goHome()">← Inicio</button>
  <div class="card"><div id="score" class="score"></div><div id="summary"></div></div>
  <div class="card"><h2>Revisión</h2><div id="review"></div></div>
</section>

<section id="history" class="hidden">
  <div class="card"><h2>Histórico</h2><div id="historyTable"></div></div>
</section>
</div>

<nav><div><button onclick="show('home')">📚<br>Tests</button><button onclick="showHistory()">📊<br>Histórico</button></div></nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script>
<script type="module">
  import * as pdfjsLib from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs";
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs";
  window._pdfjsLib=pdfjsLib;
</script>
<script>
let current=null, qi=0, answers={};
const $=id=>document.getElementById(id);
const load=(k,d=[])=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d));
const save=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

function show(id){["home","exam","result","history"].forEach(x=>$(x).classList.toggle("hidden",x!==id));if(id==="home")renderTests()}
function goHome(){show("home")}
function cleanText(s){return s.replace(/\r/g,"").replace(/[ \t]+/g," ").replace(/\n{3,}/g,"\n\n").trim()}

function parseSimulacro(text, filename="Simulacro"){
  text=cleanText(text);
  const title=(text.match(/SIMULACRO\s+\d+/i)||[filename.replace(/\.pdf$/i,"")])[0].toUpperCase();
  const keyStart=text.search(/PLANTILLA DE RESPUESTAS CORRECTAS/i);
  if(keyStart<0) throw Error("No encuentro la plantilla de respuestas.");
  const body=text.slice(0,keyStart), key=text.slice(keyStart);
  let correct={};
  const keyRe=/\b(\d{1,2})\s+([ABCD])\b/g; let m;
  while((m=keyRe.exec(key))) correct[+m[1]]=m[2];
  if(Object.keys(correct).length<10) throw Error("No he podido leer la plantilla de respuestas.");

  const qRe=/(?:^|\n)\s*(\d{1,2})\.\s+([\s\S]*?)(?=(?:\n\s*\d{1,2}\.\s)|$)/g;
  let questions=[];
  while((m=qRe.exec(body))){
    const num=+m[1], block=m[2].trim();
    const om=[...block.matchAll(/(?:^|\n)\s*([ABCD])\)\s+([\s\S]*?)(?=(?:\n\s*[ABCD]\)\s)|$)/g)];
    if(om.length===4 && correct[num]){
      const firstOpt=block.search(/(?:^|\n)\s*A\)\s/);
      const q=block.slice(0,firstOpt).replace(/\n/g," ").trim();
      questions.push({num,text:q,options:Object.fromEntries(om.map(x=>[x[1],x[2].replace(/\n/g," ").trim()])),correct:correct[num]});
    }
  }
  if(questions.length<10) throw Error("No he podido reconocer las preguntas A/B/C/D del PDF.");
  return {id:Date.now(),title,filename,questions,created:new Date().toISOString()};
}

async function importPDF(){
  const f=$("pdfFile").files[0]; if(!f)return;
  $("importMsg").textContent="Leyendo PDF…";
  try{
    if(!window._pdfjsLib) throw Error("El lector PDF aún no está disponible. Espera unos segundos y prueba de nuevo.");
    const buf=await f.arrayBuffer(), pdf=await window._pdfjsLib.getDocument({data:buf}).promise;
    let parts=[];
    for(let p=1;p<=pdf.numPages;p++){
      const page=await pdf.getPage(p), tc=await page.getTextContent();
      let lines={}, lastY=null;
      tc.items.forEach(it=>{
        const y=Math.round(it.transform[5]);
        (lines[y]??=[]).push({x:it.transform[4],s:it.str});
      });
      const ys=Object.keys(lines).map(Number).sort((a,b)=>b-a);
      parts.push(ys.map(y=>lines[y].sort((a,b)=>a.x-b.x).map(z=>z.s).join(" ")).join("\n"));
    }
    addTest(parseSimulacro(parts.join("\n"),f.name));
    $("importMsg").textContent="Importado correctamente.";
  }catch(e){$("importMsg").textContent="No se pudo importar: "+e.message}
}
function importText(){
  try{addTest(parseSimulacro($("rawText").value,"Simulacro"));$("rawText").value="";alert("Simulacro importado");}
  catch(e){alert(e.message)}
}
function addTest(t){let a=load("a2tests");a.unshift(t);save("a2tests",a);renderTests()}
function renderTests(){
  const a=load("a2tests"); $("tests").innerHTML=a.length?a.map(t=>`<div style="padding:10px 0;border-bottom:1px solid #eee"><b>${t.title}</b><br><span class="muted">${t.questions.length} preguntas</span><div class="row" style="margin-top:8px"><button class="primary" onclick="start(${t.id})">Empezar</button><button class="danger" onclick="delTest(${t.id})">Borrar</button></div></div>`).join(""):'<p class="muted">Todavía no hay simulacros.</p>';
}
function delTest(id){if(confirm("¿Borrar este simulacro?")){save("a2tests",load("a2tests").filter(x=>x.id!==id));renderTests()}}
function start(id){current=load("a2tests").find(x=>x.id===id);qi=0;answers={};show("exam");renderQ()}
function renderQ(){
  const q=current.questions[qi]; $("counter").textContent=`${qi+1} / ${current.questions.length}`;$("bar").style.width=`${(qi+1)/current.questions.length*100}%`;
  $("qtext").textContent=`${q.num}. ${q.text}`;$("opts").innerHTML=["A","B","C","D"].map(k=>`<button class="option ${answers[q.num]===k?"selected":""}" onclick="choose('${k}')"><b>${k})</b> ${q.options[k]}</button>`).join("");
}
function choose(k){answers[current.questions[qi].num]=k;renderQ()}
function clearAnswer(){delete answers[current.questions[qi].num];renderQ()}
function prevQ(){if(qi>0){qi--;renderQ()}}
function nextQ(){if(qi<current.questions.length-1){qi++;renderQ()}}
function finishExam(){
  if(!confirm("¿Finalizar el simulacro y corregirlo?"))return;
  let ok=0,bad=0,blank=0;
  current.questions.forEach(q=>{if(!answers[q.num])blank++;else if(answers[q.num]===q.correct)ok++;else bad++});
  // Configuración UC3M habitual: cada error descuenta 1/3 de un acierto.
  const net=ok-bad/3, grade=Math.max(0,net/current.questions.length*10);
  const rec={id:Date.now(),testId:current.id,title:current.title,date:new Date().toISOString(),ok,bad,blank,grade:+grade.toFixed(2),answers};
  let h=load("a2history");h.unshift(rec);save("a2history",h);
  $("score").textContent=grade.toFixed(2).replace(".",",");
  $("summary").innerHTML=`<b>${ok}</b> aciertos · <b>${bad}</b> fallos · <b>${blank}</b> en blanco<br><span class="muted">Cálculo: aciertos − fallos/3, sobre 10.</span>`;
  $("review").innerHTML=current.questions.filter(q=>answers[q.num]!==q.correct).map(q=>`<div class="card ${answers[q.num]?"wrong":"correct"}"><b>${q.num}. ${q.text}</b><p>Tu respuesta: <b>${answers[q.num]||"En blanco"}</b> · Correcta: <b>${q.correct}</b></p><p>${q.correct}) ${q.options[q.correct]}</p></div>`).join("")||"<p>¡Todo correcto!</p>";
  show("result");
}
function showHistory(){
  const h=load("a2history");$("historyTable").innerHTML=h.length?`<table><thead><tr><th>Fecha</th><th>Simulacro</th><th>Nota</th><th>A/F/B</th></tr></thead><tbody>${h.map(x=>`<tr><td>${new Date(x.date).toLocaleDateString("es-ES")}</td><td>${x.title}</td><td><b>${x.grade.toFixed(2).replace(".",",")}</b></td><td>${x.ok}/${x.bad}/${x.blank}</td></tr>`).join("")}</tbody></table>`:"<p class='muted'>Aún no hay resultados.</p>";show("history")
}
renderTests();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
window.importPDF=importPDF;window.importText=importText;window.start=start;window.delTest=delTest;window.choose=choose;window.prevQ=prevQ;window.nextQ=nextQ;window.clearAnswer=clearAnswer;window.finishExam=finishExam;window.goHome=goHome;window.show=show;window.showHistory=showHistory;
</script>
</body></html>
